server:
  port: 8081
  servlet:
    session:
      timeout: 8h

spring:
  application:
    name: balance-check
  datasource:
    url: jdbc:mysql://localhost:3306/balance_check?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  # 视频体积大，放在数据盘；可用环境变量 APP_UPLOAD_DIR 覆盖
  upload-dir: D:/develop/balance-check-data/uploads
