# 天平校验视频分析系统 后端配置
# 数据库与存储路径都可通过环境变量覆盖，交付到新机器时不必改文件：
#   SERVER_PORT、DB_URL、DB_USERNAME、DB_PASSWORD、APP_UPLOAD_DIR
server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: balance-check
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/balance_check?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:balance_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE:1GB}
      max-request-size: ${UPLOAD_MAX_REQUEST:1100MB}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    allowed-origin-patterns: ${APP_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://10.*:5173,http://192.168.*:5173,http://172.*:5173}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:15}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  # 视频体积大，放在数据盘；可用环境变量 APP_UPLOAD_DIR 覆盖
  upload-dir: ${APP_UPLOAD_DIR:D:/develop/balance-check-data/uploads}
  # 手机入口：生产环境建议设置为 http://内网域名或电脑IP（不要带 /mobile）
  public-url: ${APP_PUBLIC_URL:}
  mobile-port: ${APP_MOBILE_PORT:5173}
  video:
    # true：识别成功后删除源视频（默认，按交付问题汇总方案 B，释放磁盘、便于换机演示）
    # false：保留原始视频作为证据（方案 A），需按每年约 234GB 规划磁盘
    delete-source-after-success: ${APP_VIDEO_DELETE_SOURCE:true}
  recognition:
    # 部署时安装 Python 依赖并把本项指向实际 python；开发机可指向 analysis/.venv
    python-command: ${APP_RECOGNITION_PYTHON:python}
    script-path: ${APP_RECOGNITION_SCRIPT:../analysis/analyze_video.py}
    ffmpeg-command: ${APP_RECOGNITION_FFMPEG:ffmpeg}
    ffprobe-command: ${APP_RECOGNITION_FFPROBE:ffprobe}
    timeout-seconds: ${APP_RECOGNITION_TIMEOUT:600}
    qr-script: ${APP_RECOGNITION_QR_SCRIPT:../analysis/generate_qr.py}
    generic-profile: ${APP_RECOGNITION_GENERIC_PROFILE:generic}
    # 同一视频并行执行的显示档案数；设为 1 退化为串行（兼容低配机器）
    profile-parallelism: ${APP_RECOGNITION_PARALLELISM:3}
    device-profiles:
      F001:
        - f001
        - f001_mg
      F002:
        - f002a
        - f002b
        - f002c
      F003:
        - f003
